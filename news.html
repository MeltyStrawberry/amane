    <!-- カードを円を描いて回すプログラム -->
    <script>
        const cards = Array.from(document.querySelectorAll('.flip-card'));
        const N = cards.length;
        const RADIUS = 22;       // 横に広がる幅(vw)。大きくすると左右のカードが外に離れる
        const DURATION = 800;    // 回る時間(ミリ秒)。大きいほどゆっくり
        const MIN_SCALE = 0.6;   // 奥にあるカードの大きさ
        const MAX_SCALE = 1.2;   // 正面に来たカードの大きさ

        let current = 0;         // 現在のアニメーション位置
        let from = 0;            // アニメーション開始時の位置
        let target = 0;          // 目標とする位置（インデックス）
        let startTime = 0;
        let rafId = null;

        // カードの位置・大きさ・透明度を決める関数
        function render(pos) {
            cards.forEach((card, i) => {
                // 正面からどれだけ離れているか
                let d = i - pos;
                d = ((d + N / 2) % N + N) % N - N / 2;

                const angle = (d / N) * Math.PI * 2;
                const x = Math.sin(angle) * RADIUS;           // 横の位置
                const depth = (Math.cos(angle) + 1) / 2;      // 1=手前、0=奥
                const scale = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * depth;

                card.style.transform = `translateX(${x}vw) scale(${scale})`;
                card.style.opacity = 0.35 + 0.65 * depth;
                card.style.zIndex = Math.round(depth * 10);
                card.classList.toggle('is-front', Math.abs(d) < 0.5);
            });
        }

        // アニメーションのフレーム処理
        function tick(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / DURATION, 1);
            
            // 滑らかなイージング（easeInOutCubic）
            const eased = t < 0.5 
                ? 4 * t * t * t 
                : 1 - Math.pow(-2 * t + 2, 3) / 2;

            current = from + (target - from) * eased;
            render(current);

            if (t < 1) {
                rafId = requestAnimationFrame(tick);
            } else {
                current = target;
                render(current);
                rafId = null;
            }
        }

        // 指定したインデックスへ向かって回転を開始する
        function moveTo(newTarget) {
            from = current;
            target = newTarget;
            startTime = performance.now();
            if (!rafId) {
                rafId = requestAnimationFrame(tick);
            }
        }

        // Nextボタン（押すたびに次のカードへ進む）
        document.getElementById('cardNext').addEventListener('click', () => {
            moveTo(target + 1);
        });

        // 左右のカードをクリックしたら、それが正面に来るようにする
        cards.forEach((card, i) => {
            card.addEventListener('click', () => {
                let d = i - (target % N);
                // 最短距離で回るための計算
                d = ((d + N / 2) % N + N) % N - N / 2;
                moveTo(target + d);
            });
        });

        // 初期描画
        render(current);
    </script>
